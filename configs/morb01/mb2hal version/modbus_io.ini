# ========================================
# MB2HAL Configuration for 2x Geroosaty UM72 Cards
# ========================================

[MB2HAL_INIT]
# Debug levels: 0=silent, 1=errors, 2=confirmations, 3=debug, 4=verbose
INIT_DEBUG=0
# Enable new function codes (fnct_01, fnct_05)
VERSION=1.1
# HAL component name
HAL_MODULE_NAME=mb2hal
# Delay between transactions (0.0 = normal speed, 0.1 = debug speed)
SLOWDOWN=0.0
# Total number of transactions
# 2 cards × 2 transactions (inputs + outputs) = 12 transactions
#TOTAL_TRANSACTIONS=12
# ajm changed to 2 for debugging
TOTAL_TRANSACTIONS=6


[TRANSACTION_00]
# Serial link configuration (only needed once)
LINK_TYPE=serial
SERIAL_PORT=/dev/ttyACM0
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=2
SERIAL_DELAY_MS=0

## input pins read block
MB_SLAVE_ID=1
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=129  
NELEMENTS=16
HAL_TX_NAME=card1_in

[TRANSACTION_01]
## output pins write block
MB_SLAVE_ID=1
MB_TX_CODE=fnct_06_write_single_register
FIRST_ELEMENT=112 
NELEMENTS=1
HAL_TX_NAME=card1_out

[TRANSACTION_02]
MB_SLAVE_ID=2
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=129
NELEMENTS=16
HAL_TX_NAME=card2_in

[TRANSACTION_03]
MB_SLAVE_ID=2
MB_TX_CODE=fnct_06_write_single_register
FIRST_ELEMENT=112
NELEMENTS=1
HAL_TX_NAME=card2_out

[TRANSACTION_04]
MB_SLAVE_ID=3
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=129
NELEMENTS=16
HAL_TX_NAME=card3_in

[TRANSACTION_05]
MB_SLAVE_ID=3
MB_TX_CODE=fnct_06_write_single_register
FIRST_ELEMENT=112
NELEMENTS=1
HAL_TX_NAME=card3_out

